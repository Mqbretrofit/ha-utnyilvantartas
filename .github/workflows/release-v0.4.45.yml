name: Publish v0.4.45 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.45.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Align version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('custom_components/utnyilvantartas')

          p = root / 'frontend/utnyilvantartas-card.js'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Panel v0\.4\.\d+ betöltve', 'Panel v0.4.45 betöltve', s, count=1)
          p.write_text(s, encoding='utf-8')

          p = root / 'frontend/__init__.py'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\?v=0\.4\.\d+', '?v=0.4.45', s, count=1)
          s = re.sub(r'"version": "0\.4\.\d+"', '"version": "0.4.45"', s, count=1)
          p.write_text(s, encoding='utf-8')

          p = root / 'manifest.json'
          manifest = json.loads(p.read_text(encoding='utf-8'))
          manifest['version'] = '0.4.45'
          p.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Aktuális verzió: \*\*0\.4\.\d+\*\*', 'Aktuális verzió: **0.4.45**', s, count=1)
          if '## 0.4.45' not in s:
              notes = (
                  '## 0.4.45\n\n'
                  '- Recorder teljesítményjavítás: a nagy havi `records` attribútum továbbra is elérhető az élő Home Assistant state-ben és a dashboard számára, de nem kerül eltárolásra a Recorder adatbázisában.\n'
                  '- Megszűnik a `State attributes ... exceed maximum size of 16384 bytes` figyelmeztetés a havi bejárási jogosultság szenzoroknál.\n'
                  '- A havi lista, GPS-diagnosztika, PDF és a meglévő funkciók változatlanul működnek.\n\n'
              )
              s = s.replace('## 0.4.44\n', notes + '## 0.4.44\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/utnyilvantartas
          node --check custom_components/utnyilvantartas/frontend/utnyilvantartas-card.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/utnyilvantartas')
          assert json.loads((root / 'manifest.json').read_text(encoding='utf-8'))['version'] == '0.4.45'
          sensor = (root / 'sensor.py').read_text(encoding='utf-8')
          assert '_unrecorded_attributes = frozenset({"records"})' in sensor
          frontend = (root / 'frontend/__init__.py').read_text(encoding='utf-8')
          assert '?v=0.4.45' in frontend
          assert '"version": "0.4.45"' in frontend
          card = (root / 'frontend/utnyilvantartas-card.js').read_text(encoding='utf-8')
          assert 'Panel v0.4.45 betöltve' in card
          print('Validation OK')
          PY

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md custom_components/utnyilvantartas
          if ! git diff --cached --quiet; then
            git commit -m 'Release v0.4.45: recorder attribute fix'
            git push origin main
          fi

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.45.zip custom_components README.md .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.45

          Recorder adatbázis-terhelés javítása.

          ### Változások
          - a havi `records` attribútum megmarad az élő Home Assistant state-ben, így a dashboard napi részletei változatlanul működnek;
          - a `records` attribútum nem kerül többé a Recorder adatbázisába;
          - megszűnik a 16384 bájtos state-attribute figyelmeztetés a havi bejárási jogosultság szenzoroknál;
          - a havi lista, GPS-diagnosztika, PDF és minden korábbi funkció megmarad.
          EOF
          gh release create v0.4.45 \
            ha-utnyilvantartas-v0.4.45.zip \
            --target main \
            --title "Útnyilvántartás v0.4.45" \
            --notes-file /tmp/release-notes.md \
            --latest
