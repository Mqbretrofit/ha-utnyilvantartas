name: Publish v0.4.43 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.43.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate brand PNG
        shell: bash
        run: |
          set -euo pipefail
          file custom_components/utnyilvantartas/brand/icon.png
          file custom_components/utnyilvantartas/brand/logo.png
          python - <<'PY'
          from pathlib import Path
          sig = b'\x89PNG\r\n\x1a\n'
          for p in [
              Path('custom_components/utnyilvantartas/brand/icon.png'),
              Path('custom_components/utnyilvantartas/brand/logo.png'),
          ]:
              data = p.read_bytes()
              assert data.startswith(sig), f'{p} is not a PNG'
              assert b'IHDR' in data[:64], f'{p} has no PNG IHDR'
              assert data.endswith(b'IEND\xaeB`\x82'), f'{p} has no PNG IEND'
              print(p, 'PNG OK', len(data), 'bytes')
          PY

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.43.zip custom_components README.md .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.43

          Brand PNG javítás.

          ### Változások
          - az előző kiadás hibásan kódolt brand képei cserélve;
          - valódi, ellenőrzött 256×256 PNG `icon.png` és `logo.png`;
          - hibás dark/@2x fájlok eltávolítva;
          - a Home Assistant saját brand fallback mechanizmusát használjuk;
          - minden korábbi funkció változatlan.
          EOF
          gh release create v0.4.43 \
            ha-utnyilvantartas-v0.4.43.zip \
            --target main \
            --title "Útnyilvántartás v0.4.43" \
            --notes-file /tmp/release-notes.md \
            --latest
