name: Publish v0.4.44 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.44.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update wording and version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('custom_components/utnyilvantartas')

          p = root / 'frontend/utnyilvantartas-card.js'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Panel v0\.4\.\d+ betöltve', 'Panel v0.4.44 betöltve', s, count=1)
          replacements = {
              '["Bejárás jár", this._onOff(this._state(ids.eligibleToday))]': '["Bejárás elszámolható", this._onOff(this._state(ids.eligibleToday))]',
              '<span class="pill danger">NEM JÁR</span>': '<span class="pill danger">NEM ELSZÁMOLHATÓ</span>',
              '<span class="pill success">JÁR · 2/2 ÚT</span>': '<span class="pill success">ELSZÁMOLHATÓ · 2/2 ÚT</span>',
              '<span class="pill warn">1 ÚT JÁR</span>': '<span class="pill warn">1 ÚT ELSZÁMOLHATÓ</span>',
              '<span class="pill danger">NEM JÁR · 0/2</span>': '<span class="pill danger">NEM ELSZÁMOLHATÓ · 0/2</span>',
              '"BEJÁRÁS JÁR · 2/2 ÚT"': '"ELSZÁMOLHATÓ · 2/2 ÚT"',
              '"RÉSZBEN JÁR · 1/2 ÚT"': '"RÉSZBEN ELSZÁMOLHATÓ · 1/2 ÚT"',
              '"BEJÁRÁS NEM JÁR · 0/2 ÚT"': '"NEM ELSZÁMOLHATÓ · 0/2 ÚT"',
              'A céges autóra vonatkozó JÁR / NEM JÁR döntés': 'A céges autóra vonatkozó ELSZÁMOLHATÓ / NEM ELSZÁMOLHATÓ döntés',
              '<span>Bejárás jár</span>': '<span>Elszámolható</span>',
              '<span>Nem jár</span>': '<span>Nem elszámolható</span>',
              '<span>Reggeli út jár<br>': '<span>Reggeli út elszámolható<br>',
              '<span>Esti út jár<br>': '<span>Esti út elszámolható<br>',
              '<span class="dot green"></span>2/2 út jár <span class="dot orange"></span>1/2 út jár / függő <span class="dot red"></span>0/2 út jár': '<span class="dot green"></span>2/2 elszámolható <span class="dot orange"></span>1/2 elszámolható / függő <span class="dot red"></span>0/2 elszámolható',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing frontend text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = root / 'coordinator.py'
          s = p.read_text(encoding='utf-8')
          replacements = {
              'return f"{name}: JÁR"': 'return f"{name}: ELSZÁMOLHATÓ"',
              'return f"{name}: NEM JÁR (céges autó Otthon: {first_text}–{last_text})"': 'return f"{name}: NEM ELSZÁMOLHATÓ (céges autó Otthon: {first_text}–{last_text})"',
              'return f"{name}: NEM JÁR"': 'return f"{name}: NEM ELSZÁMOLHATÓ"',
              'egyik bejárási út sem jár': 'egyik bejárási út sem elszámolható',
              'JÁR/NEM JÁR result': 'ELSZÁMOLHATÓ/NEM ELSZÁMOLHATÓ result',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing coordinator text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = root / 'binary_sensor.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('saját autós bejárási út jár ', 'saját autós bejárási út elszámolható ')
          s = s.replace('Ma egyik saját autós bejárási út sem jár', 'Ma egyik saját autós bejárási út sem elszámolható')
          p.write_text(s, encoding='utf-8')

          for rel in ('strings.json', 'translations/hu.json'):
              p = root / rel
              s = p.read_text(encoding='utf-8')
              if '"Bejárási hozzájárulás jár"' not in s:
                  raise SystemExit(f'Missing translation text in {rel}')
              s = s.replace('"Bejárási hozzájárulás jár"', '"Bejárás elszámolható"')
              p.write_text(s, encoding='utf-8')

          p = root / 'services.yaml'
          s = p.read_text(encoding='utf-8')
          if 'name: Reggeli út jár' not in s or 'name: Esti út jár' not in s:
              raise SystemExit('Missing service labels')
          s = s.replace('name: Reggeli út jár', 'name: Reggeli út elszámolható')
          s = s.replace('name: Esti út jár', 'name: Esti út elszámolható')
          p.write_text(s, encoding='utf-8')

          p = root / 'frontend/__init__.py'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\?v=0\.4\.\d+', '?v=0.4.44', s, count=1)
          s = re.sub(r'"version": "0\.4\.\d+"', '"version": "0.4.44"', s, count=1)
          p.write_text(s, encoding='utf-8')

          p = root / 'manifest.json'
          manifest = json.loads(p.read_text(encoding='utf-8'))
          manifest['version'] = '0.4.44'
          p.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Aktuális verzió: \*\*0\.4\.\d+\*\*', 'Aktuális verzió: **0.4.44**', s, count=1)
          s = s.replace('- napi JÁR / NEM JÁR döntés;', '- napi ELSZÁMOLHATÓ / NEM ELSZÁMOLHATÓ döntés;')
          if '## 0.4.44' not in s:
              notes = (
                  '## 0.4.44\n\n'
                  '- A felületen a korábbi **JÁR / NEM JÁR** helyett **ELSZÁMOLHATÓ / NEM ELSZÁMOLHATÓ** jelenik meg.\n'
                  '- A napi badge-ek, összesítők, részletek, kézi kiegészítés, jelmagyarázat és indoklás egységes megnevezést használ.\n'
                  '- A Home Assistant entitás- és szolgáltatásnevek szövegezése is ehhez igazodik.\n\n'
              )
              s = s.replace('## 0.4.43\n', notes + '## 0.4.43\n', 1)
          p.write_text(s, encoding='utf-8')

          js = (root / 'frontend/utnyilvantartas-card.js').read_text(encoding='utf-8')
          for forbidden in ('NEM JÁR', 'JÁR · 2/2', '1 ÚT JÁR', 'Bejárás jár', 'Nem jár', 'Reggeli út jár', 'Esti út jár'):
              if forbidden in js:
                  raise SystemExit(f'Old UI wording remains: {forbidden}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/utnyilvantartas
          node --check custom_components/utnyilvantartas/frontend/utnyilvantartas-card.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/utnyilvantartas')
          assert json.loads((root / 'manifest.json').read_text())['version'] == '0.4.44'
          json.loads((root / 'strings.json').read_text())
          json.loads((root / 'translations/hu.json').read_text())
          print('Validation OK')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md custom_components/utnyilvantartas
          git commit -m 'Release v0.4.44: elszámolható wording'
          git push origin main

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.44.zip custom_components README.md .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.44

          Megnevezések egységesítése.

          ### Változások
          - `JÁR / NEM JÁR` helyett `ELSZÁMOLHATÓ / NEM ELSZÁMOLHATÓ`;
          - napi badge-ek, összesítők és részletek frissítve;
          - kézi kiegészítés és jelmagyarázat frissítve;
          - entitás- és szolgáltatásnevek szövegezése egységesítve;
          - minden korábbi funkció változatlanul megmaradt.
          EOF
          gh release create v0.4.44 \
            ha-utnyilvantartas-v0.4.44.zip \
            --target main \
            --title "Útnyilvántartás v0.4.44" \
            --notes-file /tmp/release-notes.md \
            --latest
