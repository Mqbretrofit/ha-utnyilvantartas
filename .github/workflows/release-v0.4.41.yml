name: Publish v0.4.41 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.41.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.41.zip custom_components README.md .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.41

          Ikonjavító kiadás.

          ### Változások
          - A saját Útnyilvántartás ikon bekerült a `custom_components/utnyilvantartas/brand/` könyvtárba.
          - `brand/icon.png` és `brand/logo.png` hozzáadva.
          - Home Assistant 2026.3+ alatt az integrációs oldalon közvetlenül a helyi brand képet használja.
          - Minden v0.4.40 funkció változatlanul megmaradt.
          EOF
          gh release create v0.4.41 \
            ha-utnyilvantartas-v0.4.41.zip \
            --target main \
            --title "Útnyilvántartás v0.4.41" \
            --notes-file /tmp/release-notes.md \
            --latest
