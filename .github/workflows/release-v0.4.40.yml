name: Publish v0.4.40 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.40.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.40.zip custom_components README.md .gitignore

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.4.40 >/dev/null 2>&1; then
            echo "Release v0.4.40 already exists."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.40

          Első publikus release az Alapnyomkövetés + Kelio alapú Home Assistant útnyilvántartáshoz.

          ### Fő funkciók
          - havi bejárási jogosultság és térítés számítása;
          - Kelio jelenléti adatok és Alapnyomkövetés GPS/útvonal adatok feldolgozása;
          - reggeli és esti bejárási utak külön értékelése;
          - kézi hónapvégi kiegészítés;
          - folyamatos óraállás-kezelés;
          - Alapnyomkövetés szerveroldali Kiértékelés megjelenítése;
          - napi útvonal és GPX export;
          - AXEL-jellegű havi PDF;
          - NAV üzemanyagár és fogyasztási norma támogatás;
          - PDF küldése e-mailben;
          - mentett PDF-ek listázása, megnyitása és nyomtatása;
          - saját Home Assistant oldalsávos JavaScript dashboard.

          A repository és a release nem tartalmaz felhasználóspecifikus hitelesítő vagy személyes adatokat.
          EOF
          gh release create v0.4.40 \
            ha-utnyilvantartas-v0.4.40.zip \
            --target main \
            --title "Útnyilvántartás v0.4.40" \
            --notes-file /tmp/release-notes.md \
            --latest
