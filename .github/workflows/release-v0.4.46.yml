name: Publish v0.4.46 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.46.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/utnyilvantartas
          node --input-type=module --check < custom_components/utnyilvantartas/frontend/utnyilvantartas-panel.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/utnyilvantartas')
          assert json.loads((root / 'manifest.json').read_text(encoding='utf-8'))['version'] == '0.4.46'
          frontend = (root / 'frontend/__init__.py').read_text(encoding='utf-8')
          assert '?v=0.4.46' in frontend
          assert '"version": "0.4.46"' in frontend
          panel = (root / 'frontend/utnyilvantartas-panel.js').read_text(encoding='utf-8')
          assert 'Autó' in panel
          assert 'config_entry_id' in panel
          print('Validation OK')
          PY

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.46.zip custom_components README.md .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.46

          Több autó támogatása az oldalsávos Útnyilvántartás panelen.

          ### Változások
          - több konfigurált autó esetén Autó választó jelenik meg a panel tetején;
          - autóváltáskor a havi adatok, napi részletek, hónapváltás, kézi kiegészítés, frissítés és PDF-műveletek a kiválasztott config entryhez tartoznak;
          - a kiválasztott autót a böngésző megjegyzi;
          - egyetlen autó esetén nem jelenik meg felesleges választó;
          - az explicit entity beállítású egyedi dashboard-kártyák változatlanul a megadott entitáshoz maradnak kötve;
          - a stabil 0.4.45 kártyalogika változatlan core fájl maradt, a multi-car támogatás külön frontend réteg.
          EOF
          gh release create v0.4.46 \
            ha-utnyilvantartas-v0.4.46.zip \
            --target main \
            --title "Útnyilvántartás v0.4.46" \
            --notes-file /tmp/release-notes.md \
            --latest
