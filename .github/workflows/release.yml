name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/utnyilvantartas/manifest.json"
      - "custom_components/utnyilvantartas/**"
      - "README.md"
      - "hacs.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: utnyilvantartas-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("custom_components/utnyilvantartas/manifest.json").read_text())
          print(data["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build HACS ZIP
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          ZIP="ha-utnyilvantartas-v${VERSION}.zip"
          zip -r "$ZIP" custom_components/utnyilvantartas hacs.json README.md
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create tag and GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "Útnyilvántartás v${VERSION}" \
            --generate-notes
