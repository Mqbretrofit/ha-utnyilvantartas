name: Publish v0.4.51 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.51.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/utnyilvantartas
          node --input-type=module --check < custom_components/utnyilvantartas/frontend/utnyilvantartas-card.js
          node --input-type=module --check < custom_components/utnyilvantartas/frontend/utnyilvantartas-panel.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/utnyilvantartas')
          assert json.loads(Path('hacs.json').read_text(encoding='utf-8'))['name'] == 'Útnyilvántartás'
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.4.51'
          frontend = (root / 'frontend/__init__.py').read_text(encoding='utf-8')
          assert frontend.count('?v=0.4.51') == 2
          assert '"version": "0.4.51"' in frontend
          coordinator = (root / 'coordinator.py').read_text(encoding='utf-8')
          assert '_async_publish_cached_manual_days' in coordinator
          assert '_rewrite_manual_month_payload' in coordinator
          set_method = coordinator.split('async def async_set_manual_day', 1)[1].split('async def async_remove_manual_day', 1)[0]
          remove_method = coordinator.split('async def async_remove_manual_day', 1)[1].split('@staticmethod', 1)[0]
          assert 'self.async_set_updated_data(updated)' in set_method
          assert 'self.async_set_updated_data(updated)' in remove_method
          assert set_method.count('await self.async_refresh()') == 1
          assert remove_method.count('await self.async_refresh()') == 1
          card = (root / 'frontend/utnyilvantartas-card.js').read_text(encoding='utf-8')
          assert '_waitForManualState' in card
          assert 'manual-status' in card
          assert 'elmentve és ellenőrizve' in card
          print('Validation OK')
          PY

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.51.zip custom_components README.md hacs.json .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.51

          Gyors és visszaellenőrzött hónap végi kézi kiegészítés.

          ### Változások
          - a kézi nap mentése és törlése nem indít teljes havi Kelio/GPS-frissítést;
          - a havi összesítők, térítés és óraállás közvetlenül frissülnek;
          - a felület visszaellenőrzi a havi rekordot;
          - a mentési állapot és a konkrét hiba a kézi kiegészítés alatt jelenik meg;
          - a már meglévő napi felülbírálások érintetlenek maradnak.
          EOF
          gh release create v0.4.51 \
            ha-utnyilvantartas-v0.4.51.zip \
            --target main \
            --title "Útnyilvántartás v0.4.51" \
            --notes-file /tmp/release-notes.md \
            --latest
