name: Publish v0.4.47 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.47.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/utnyilvantartas
          node --input-type=module --check < custom_components/utnyilvantartas/frontend/utnyilvantartas-panel.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/utnyilvantartas')
          assert json.loads((root / 'manifest.json').read_text(encoding='utf-8'))['version'] == '0.4.47'
          frontend = (root / 'frontend/__init__.py').read_text(encoding='utf-8')
          assert '?v=0.4.47' in frontend
          assert '"version": "0.4.47"' in frontend
          init_py = (root / '__init__.py').read_text(encoding='utf-8')
          assert 'set_accounting_override' in init_py
          assert 'remove_accounting_override' in init_py
          accounting = (root / 'accounting_override.py').read_text(encoding='utf-8')
          assert 'UtnyMonthlyAccountingCoordinator' in accounting
          assert 'automatic_morning_commute_eligible' in accounting
          panel = (root / 'frontend/utnyilvantartas-panel.js').read_text(encoding='utf-8')
          assert 'Autó' in panel
          assert 'NAPI ELSZÁMOLÁS SZERKESZTÉSE' in panel
          assert 'set_accounting_override' in panel
          assert 'remove_accounting_override' in panel
          print('Validation OK')
          PY

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.47.zip custom_components README.md .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.47

          Naponkénti kézi elszámolási felülbírálás a bejárási költséghez.

          ### Változások
          - a havi napi bontás igazolt jelenléti sorain ceruza gombbal szerkeszthető a reggeli és esti bejárási út elszámolhatósága;
          - külön gyorsgombbal mindkét út kizárható, például amikor másik céges autóval történt a hazautazás;
          - a kézi módosítás csak az elszámolási eredményt változtatja, az eredeti Kelio- és GPS-adatot nem;
          - a felülbírálás külön, autónkénti fájlban marad meg, ezért havi frissítés után sem vész el;
          - az automatikus eredmény és indok megmarad diagnosztikai adatként, és bármikor visszaállítható;
          - a havi elszámolható utak, saját autós kilométer, térítés és óraállás automatikusan újraszámolódik;
          - a PDF-generálás a már felülbírált havi eredményt használja;
          - a 0.4.46 több-autós választó és a korábbi kézi Kelio-kiegészítés változatlanul megmarad.
          EOF
          gh release create v0.4.47 \
            ha-utnyilvantartas-v0.4.47.zip \
            --target main \
            --title "Útnyilvántartás v0.4.47" \
            --notes-file /tmp/release-notes.md \
            --latest
