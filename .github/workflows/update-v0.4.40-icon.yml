name: Update v0.4.40 release icon

on:
  push:
    paths:
      - '.github/workflows/update-v0.4.40-icon.yml'

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild release package with icon
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.40.zip custom_components README.md .gitignore assets/utnyilvantartas-icon.png

      - name: Upload icon and refreshed package to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.4.40 assets/utnyilvantartas-icon.png --clobber
          gh release upload v0.4.40 ha-utnyilvantartas-v0.4.40.zip --clobber
