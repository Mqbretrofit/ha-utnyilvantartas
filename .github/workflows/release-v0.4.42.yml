name: Publish v0.4.42 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.42.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.42.zip custom_components README.md .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.42

          Home Assistant ikon-kompatibilitási javítás.

          ### Változások
          - teljes helyi brand-készlet az integrációban;
          - normál, dark és @2x ikon/logó variánsok;
          - nagy DPI-s és sötét témás frontend kérések támogatása;
          - minden v0.4.41 funkció változatlanul megmaradt.
          EOF
          gh release create v0.4.42 \
            ha-utnyilvantartas-v0.4.42.zip \
            --target main \
            --title "Útnyilvántartás v0.4.42" \
            --notes-file /tmp/release-notes.md \
            --latest
