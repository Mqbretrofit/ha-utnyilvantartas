name: Publish v0.4.49 release

on:
  push:
    paths:
      - '.github/workflows/release-v0.4.49.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/utnyilvantartas
          node --input-type=module --check < custom_components/utnyilvantartas/frontend/utnyilvantartas-panel.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/utnyilvantartas')
          assert json.loads(Path('hacs.json').read_text(encoding='utf-8'))['name'] == 'Útnyilvántartás'
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.4.49'
          assert manifest['issue_tracker'].endswith('/issues')
          frontend = (root / 'frontend/__init__.py').read_text(encoding='utf-8')
          assert frontend.count('?v=0.4.49') == 2
          assert '"version": "0.4.49"' in frontend
          panel = (root / 'frontend/utnyilvantartas-panel.js').read_text(encoding='utf-8')
          assert '_utnyWaitForAccountingOverride' in panel
          assert 'A mentett adatok visszaellenőrzése' in panel
          assert 'A mentés nem ellenőrizhető' in panel
          assert 'Elszámolás elmentve és ellenőrizve' in panel
          print('Validation OK')
          PY

      - name: Build install package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ha-utnyilvantartas-v0.4.49.zip custom_components README.md hacs.json .gitignore assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Útnyilvántartás v0.4.49

          HACS-kompatibilis kiadás az ellenőrzött napi elszámolási mentéssel.

          ### Változások
          - a kiadás címkéjén elérhető a HACS által megkövetelt gyökérszintű `hacs.json`;
          - a Home Assistant manifest külön hibajegy-kezelési hivatkozást kapott;
          - a v0.4.48 ellenőrzött mentési javítása változatlanul része a kiadásnak.
          EOF
          gh release create v0.4.49 \
            ha-utnyilvantartas-v0.4.49.zip \
            --target main \
            --title "Útnyilvántartás v0.4.49" \
            --notes-file /tmp/release-notes.md \
            --latest
